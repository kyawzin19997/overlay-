<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BCC Broadcast CG — OBS Feed Rundown Dock</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="css/broadcast.css" />
  <link rel="stylesheet" href="css/studio.css" />
</head>
<body class="bg-zinc-950 text-slate-100 min-h-screen">
  <div id="feed-view" class="feed-container">
    <div class="flex items-center justify-between pb-2 border-b border-zinc-800 mb-3">
      <div class="flex items-center gap-2">
        <span class="font-bold text-xs tracking-wider uppercase text-amber-400 font-['Montserrat']">Broadcast Rundown</span>
      </div>
      <div class="flex items-center gap-1.5">
        <button type="button" onclick="feedPrev()" class="px-2 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-xs text-zinc-200">◀ Prev</button>
        <button type="button" onclick="feedNext()" class="px-2 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-xs text-zinc-200">Next ▶</button>
        <button type="button" onclick="triggerHide()" class="px-2.5 py-1 rounded bg-red-700 hover:bg-red-600 text-xs font-bold text-white">Hide</button>
      </div>
    </div>
    <div id="feed-cue-list" class="space-y-2"></div>
  </div>

  <div id="toast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full bg-zinc-900 border border-amber-400/70 text-xs font-semibold text-amber-200 shadow-2xl z-50"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/frames.js"></script>
  <script src="js/ui.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      loadSavedState();
      initSyncChannel();
      renderFeedView();
    });
  </script>
</body>
</html>
