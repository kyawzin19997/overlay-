<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BCC Broadcast CG — Stream Deck &amp; Touch Control</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="css/broadcast.css" />
  <link rel="stylesheet" href="css/studio.css" />
</head>
<body class="bg-zinc-950 text-slate-100 min-h-screen">
  <div id="deck-view" class="deck-container">
    <div class="deck-header">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-red-600 animate-pulse"></span>
        <span class="font-bold text-sm tracking-wide uppercase font-['Montserrat']">BCC Touch Control</span>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" onclick="clearAllGraphics()" class="px-3 py-1.5 rounded-lg bg-red-600 hover:bg-red-500 text-white font-bold text-xs uppercase tracking-wider shadow">
          CLEAR ALL
        </button>
        <button type="button" onclick="triggerHide()" class="px-3 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-red-300 font-bold text-xs uppercase tracking-wider">
          Hide LT
        </button>
      </div>
    </div>

    <!-- Quick Global Actions -->
    <div>
      <div class="deck-section-title">Quick Actions</div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
        <button type="button" onclick="triggerShow()" class="deck-btn action-primary">
          <span class="text-xs font-bold uppercase">Show Active LT</span>
        </button>
        <button type="button" onclick="triggerHide()" class="deck-btn action-danger">
          <span class="text-xs font-bold uppercase">Hide Active LT</span>
        </button>
        <button type="button" onclick="toggleTickerPause()" class="deck-btn action-warning">
          <span class="text-xs font-bold uppercase">Pause/Resume Ticker</span>
        </button>
        <button type="button" onclick="clearAllGraphics()" class="deck-btn action-danger">
          <span class="text-xs font-bold uppercase">EMERGENCY CLEAR</span>
        </button>
      </div>
    </div>

    <!-- One-Click Lower Thirds -->
    <div>
      <div class="deck-section-title">One-Click Lower Thirds</div>
      <div id="deck-grid-cues" class="deck-grid"></div>
    </div>

    <!-- One-Click Marquee Presets -->
    <div>
      <div class="deck-section-title">Marquee / Ticker Presets</div>
      <div id="deck-grid-marquee" class="deck-grid"></div>
    </div>

    <!-- One-Click OBS Frame Layouts -->
    <div>
      <div class="deck-section-title">OBS Frame Layouts</div>
      <div id="deck-grid-frames" class="deck-grid"></div>
    </div>
  </div>

  <div id="toast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full bg-zinc-900 border border-amber-400/70 text-xs font-semibold text-amber-200 shadow-2xl z-50"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/frames.js"></script>
  <script src="js/ui.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      loadSavedState();
      initSyncChannel();
      renderDeckView();
    });
  </script>
</body>
</html>
